name: Deploy to GitHub Pages

on:
  # Cada vez que subes cambios a main
  push:
    branches: [main]
  # Cada noche, para actualizar el chiste del día
  schedule:
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"
  # Para lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build and upload site
        uses: withastro/action@v2
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
